name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui-frontend/package-lock.json

      - name: Rust toolchain (stable + musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: musl-tools（bundled sqlite 的 C 编译需要 musl-gcc）
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: 前端构建（产物直写 crates/webui/static，rust-embed 随包体编译）
        working-directory: webui-frontend
        run: |
          npm ci
          npm run build

      - name: 全量测试（38 个，mock WS/LLM，不依赖外部服务）
        run: cargo test --workspace

      - name: musl release 构建
        run: cargo build --release --target x86_64-unknown-linux-musl -p yuantuan

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: yuantuan-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/yuantuan

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: yuantuan-linux-x86_64

      - name: 校验和
        run: |
          mv yuantuan yuantuan-linux-x86_64
          sha256sum yuantuan-linux-x86_64 > yuantuan-linux-x86_64.sha256
          mkdir -p dist && mv yuantuan-linux-x86_64 yuantuan-linux-x86_64.sha256 dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
