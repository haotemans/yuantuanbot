name: yuantuan

# yuantuan + napcat 同 compose 内网
# 端口开放策略:
#   - 8085 / 3001 / 6099 一律 127.0.0.1 绑定 → 用户走 SSH 隧道访问
#   - 6199 不暴露公网,只在 yuantuan-net 内网给 napcat 拨入
# G007 修正:restart: unless-stopped → docker 守护接管进程拉活,
#           面板「保存并重启」按钮在容器内被禁用(后端检测 /.dockerenv)

services:
  yuantuan:
    image: yuantuan:local
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: yuantuan
    restart: unless-stopped
    working_dir: /app
    volumes:
      # bind mount 不用 named volume — 宿主直接控制权限,容器 uid 1000 & 宿主 uid 1000 对齐
      # 第一次启动前需要:mkdir -p data && sudo chown -R 1000:1000 data( install.sh 做)
      - ./data:/app/data
      # 面板「保存」需要回写 config.toml/providers.toml → 不能 :ro
      # 宿主机文件被容器覆盖是预期行为(单源 = 宿主机文件)
      - ./yuantuan-config.toml:/app/config.toml
      - ./yuantuan-providers.toml:/app/providers.toml
    ports:
      - "127.0.0.1:8085:8085"    # 面板,仅 SSH 隧道
    expose:
      - "6199"                    # 内网给 napcat 拨
    networks:
      - yuantuan-net
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://127.0.0.1:8085/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      - NAPCAT_UID=10001
      - NAPCAT_GID=10001
    volumes:
      - napcat-qq:/app/napcat/config
      - napcat-cache:/app/.config/QQ
    ports:
      - "127.0.0.1:6099:6099"    # NapCat WebUI(/webui)+ HTTP API,仅 SSH 隧道
      # 注:NapCat 的 WebUI 实际监听 6099 不是 3001;3001 是模板文档里的旧默认
    networks:
      - yuantuan-net
    depends_on:
      - yuantuan
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  yuantuan-net:
    driver: bridge

volumes:
  yuantuan-data:
  napcat-qq:
  napcat-cache:
