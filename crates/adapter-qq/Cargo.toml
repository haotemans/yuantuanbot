[package]
name = "yuantuan-adapter-qq"
version = "0.1.0"
edition = "2021"

[dependencies]
yuantuan-core = { path = "../core" }
tokio-tungstenite = "0.24"
futures-util = "0.3"
url = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
tracing = "0.1"
