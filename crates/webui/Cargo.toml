[package]
name = "yuantuan-webui"
version = "0.1.0"
edition = "2021"

[dependencies]
yuantuan-core = { path = "../core" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sqlx.workspace = true
argon2 = "0.5"
rand = "0.9"
rust-embed = "8"
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sysinfo = "0.38.4"

[dev-dependencies]
tokio-tungstenite = "0.24"
futures-util = "0.3"
