[package]
name = "yuantuan-plugin-hello"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
yuantuan-core = { path = "../../crates/core" }
async-trait = "0.1"
anyhow = "1"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
